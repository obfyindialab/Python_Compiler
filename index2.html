<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Compiler</title>
<link rel="icon" href="https://www.python.org/static/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  background:#0B85FF;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#fff;
}
.container{
  background:rgba(255,255,255,0.15);
  border-radius:16px;
  padding:30px;
  width:400px;
  max-width:95%;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,0.25);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.3);
}
h2{
    margin-bottom:20px;
    color:#fff;
    display: flex;
    align-items: center;
    justify-content: center;
}
h2 img {
    height: 30px;
    margin-right: 10px;
    vertical-align: middle;
    /* Glassmorphism style for the logo */
    backdrop-filter: blur(8px);
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    padding: 5px;
}
textarea{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.2);
  color:#fff;
  font-size:15px;
  outline:none;
  resize:none;
}
textarea::placeholder{color:rgba(255,255,255,0.7);}
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:rgba(11,133,255,0.7);
  color:#fff;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.3);
  backdrop-filter:blur(10px);
  transition:.3s;
  position:relative;
}
button:hover{background:rgba(11,133,255,0.9);transform:scale(1.03);}
.output-box{
  width:100%;
  min-height:120px;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  background:rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.3);
  color:#fff;
  text-align:left;
  font-family:monospace;
  white-space: pre-wrap;
  word-break: break-word;
  overflow: auto;
}
.spinner {
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -10px;
    margin-left: -10px;
}
button.loading .spinner { display: block; }
button.loading span, button.loading i { visibility: hidden; } /* फिक्स: आइकन और टेक्स्ट दोनों को छिपाएं */
@keyframes spin { to { transform: rotate(360deg); } }

.output-loader {
    display: none;
    text-align: center;
    padding-top: 30px;
}
.output-loader.active {
    display: block;
}
.dot-spinner {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 30px;
}
.dot {
    width: 10px;
    height: 10px;
    background-color: #fff;
    border-radius: 50%;
    margin: 0 5px;
    animation: bounce 1.4s infinite ease-in-out both;
}
.dot:nth-child(1) { animation-delay: -0.32s; }
.dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}

.typing-effect {
    font-family: monospace;
    overflow: hidden;
    border-right: .15em solid #fff;
    white-space: pre;
    animation:
      typing 3s steps(40, end),
      blink-caret .75s step-end infinite;
}

/* The typing animation effect */
@keyframes typing {
    from { width: 0 }
    to { width: 100% }
}

/* The typewriter cursor effect */
@keyframes blink-caret {
    from, to { border-color: transparent }
    50% { border-color: #fff; }
}

/* Error text color */
.error-text {
  color: #ff6347; /* Red-orange color for errors */
}
</style>
</head>
<body>

<div class="container">
  <h2><img src="https://www.python.org/static/favicon.ico" alt="Python Logo">Python Compiler</h2>
  <textarea id="code-input" placeholder="Write your Python code here...">print("Hello, World!")</textarea>
  <button id="run-btn">
    <i class="fas fa-play"></i><span> Run Code</span>
    <div class="spinner"></div>
  </button>
  <div class="output-box" id="output-box">
    <div class="output-loader" id="output-loader">
      <div class="dot-spinner">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
    <div id="output-text">Output will appear here...</div>
  </div>
</div>

<audio id="typing-sound" preload="auto">
  <source src="https://pycompiler-eight.vercel.app//computer-access-granted.mp3" type="audio/mp3">
</audio>

<script>
const runBtn = document.getElementById("run-btn");
const codeInput = document.getElementById("code-input");
const outputBox = document.getElementById("output-box");
const outputLoader = document.getElementById("output-loader");
const outputText = document.getElementById("output-text");
const typingSound = document.getElementById("typing-sound");
const pythonLogo = `>>> `; // A simple and recognizable text logo

function setButtonLoading(button, isLoading){
    button.classList.toggle('loading', isLoading);
    button.disabled = isLoading;
}

// Function to handle the typing effect
function typeText(element, text, speed = 30) {
    let i = 0;
    element.innerHTML = "";
    element.classList.add('typing-effect');
    element.style.whiteSpace = 'pre';

    const timer = setInterval(() => {
        if (i < text.length) {
            // Play sound for each character.
            if (text.charAt(i).trim() !== '') {
                typingSound.currentTime = 0;
                typingSound.play();
            }

            element.innerHTML += text.charAt(i);
            i++;
        } else {
            clearInterval(timer);
            element.classList.remove('typing-effect');
        }
    }, speed);
}

runBtn.addEventListener('click', async () => {
    const code = codeInput.value.trim();
    if(!code){ 
        typeText(outputText, "Please enter some code."); 
        return; 
    }

    setButtonLoading(runBtn,true);
    outputText.innerText="";
    outputText.classList.remove('error-text');
    outputLoader.classList.add("active");

    try {
        const response = await fetch('https://emkc.org/api/v2/piston/execute', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ language: "python", version: "3.10.0", files: [{ content: code }] })
        });

        const result = await response.json();
        let output = "";

        if(result.run && result.run.stderr) {
            output = result.run.stderr;
            outputText.classList.add('error-text');
        } else if (result.run) {
            output = result.run.stdout || "No output";
        } else {
            output = "Error: " + (result.message || "Unknown error occurred.");
            outputText.classList.add('error-text');
        }
        
        // Add the logo to the beginning of the output
        const finalOutput = pythonLogo + output;
        
        typeText(outputText, finalOutput);

    } catch(err){
        const errorOutput = "Error running code: " + err.message;
        outputText.classList.add('error-text');
        typeText(outputText, pythonLogo + errorOutput);
    } finally {
        setButtonLoading(runBtn,false);
        outputLoader.classList.remove("active");
    }
});
</script>

</body>
</html>
